name: PTXDist Build Environment

on:
  schedule:
    - cron: '15 22 * * *'
  push:
    branches: [ "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  # Forgejo container registry, images end up as ${REGISTRY}/${OWNER}/<name>
  REGISTRY: git.leviathan.lan
  OWNER: str

jobs:
  build:
    # The job container needs the docker CLI and the host docker socket
    # (runner config: container.docker_host: automount).
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    strategy:
       fail-fast: false
       matrix:
         ptxdist: [ 2026.01.0, 2026.02.0, 2026.03.0, 2026.04.0, 2026.05.0, 2026.06.0, 2026.07.0, 2026.08.0, 2026.09.0, 2025.10.0, 2025.11.0, 2025.12.0 ]
         toolchain: [ oselas.toolchain-2024.11, oselas.toolchain-2025.11 ]
         baseimage: [ trixie ]
         distro: [ debian ]
    env:
      IMAGE: git.leviathan.lan/str/ptxdist-${{ matrix.ptxdist }}-build-env-arm-multi.${{ matrix.toolchain }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The registry is plain HTTP, tell buildkit about it
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."${{ env.REGISTRY }}"]
              http = true
              insecure = true

      # Write the credentials directly instead of using docker/login-action:
      # 'docker login' goes through the daemon, which would need the registry
      # in its insecure-registries list.
      # REGISTRY_TOKEN: Forgejo access token with package read/write scope.
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          mkdir -p ~/.docker
          auth=$(printf '%s:%s' "${OWNER}" "${REGISTRY_TOKEN}" | base64 -w0)
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${REGISTRY}" "${auth}" > ~/.docker/config.json

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=schedule
            type=raw,value=nightly,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ptxdist-build-env/Dockerfile
          build-args: |
            REGISTRY=${{ env.REGISTRY }}/${{ env.OWNER }}
            PTXDIST_VERSION=${{ matrix.ptxdist }}
            TOOLCHAIN_VERSION=${{ matrix.toolchain }}
            BASEIMAGE=${{ matrix.distro }}.${{ matrix.baseimage }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
