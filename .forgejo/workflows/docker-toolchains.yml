name: OSELAS.Toolchain Environment

on:
  schedule:
    - cron: '00 22 * * *'
  push:
    branches: [ "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  # Forgejo container registry, images end up as ${REGISTRY}/${OWNER}/<name>
  REGISTRY: git.leviathan.lan
  OWNER: str

jobs:
  build:
    # The job container needs the docker CLI and the host docker socket
    # (runner config: container.docker_host: automount).
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    strategy:
       fail-fast: false
       matrix:
         include:
           # trixie: trixie-ptx pushed to the Forgejo registry, toolchains from
           # debian.pengutronix.de, ptxdist builds on top
           - dockerfile: ./arm-multi.trixie-ptx/Dockerfile
             baseimage: git.leviathan.lan/str/trixie-ptx:latest
             image: build-env-arm-multi.oselas.toolchain-2024.11.debian.trixie
             toolchain: "oselas.toolchain-2024.11.1-arm-v7a-linux-gnueabihf oselas.toolchain-2024.11.1-aarch64-v8a-linux-gnu"
           - dockerfile: ./arm-multi.trixie-ptx/Dockerfile
             baseimage: git.leviathan.lan/str/trixie-ptx:latest
             image: build-env-arm-multi.oselas.toolchain-2025.11.debian.trixie
             toolchain: "oselas.toolchain-2025.11.1-arm-v7a-linux-gnueabihf oselas.toolchain-2025.11.1-aarch64-v8a-linux-gnu"
           - dockerfile: ./x86.trixie-ptx/Dockerfile
             baseimage: git.leviathan.lan/str/trixie-ptx:latest
             image: build-env-x86.oselas.toolchain-2025.11.debian.trixie
             toolchain: "oselas.toolchain-2025.11.1-x86-64-unknown-linux-gnu"
           # jessie: archive.debian.org, toolchain 2018.02.0 is installed by the Dockerfile
           - dockerfile: ./arm-multi.jessie/Dockerfile
             baseimage: jessie
             image: build-env-arm-multi.oselas.toolchain-2018.02.debian.jessie
             toolchain: ""
    env:
      IMAGE: git.leviathan.lan/str/${{ matrix.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The registry is plain HTTP, tell buildkit about it
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."${{ env.REGISTRY }}"]
              http = true
              insecure = true

      # Write the credentials directly instead of using docker/login-action:
      # 'docker login' goes through the daemon, which would need the registry
      # in its insecure-registries list.
      # REGISTRY_TOKEN: Forgejo access token with package read/write scope.
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "${REGISTRY_TOKEN}" ]; then
            echo "::error::secret REGISTRY_TOKEN is empty or not set"
            exit 1
          fi
          mkdir -p ~/.docker
          auth=$(printf '%s:%s' "${OWNER}" "${REGISTRY_TOKEN}" | base64 -w0)
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${REGISTRY}" "${auth}" > ~/.docker/config.json

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=schedule
            type=raw,value=nightly,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      # TOOLCHAIN is only passed when set, so the Dockerfile default applies otherwise
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            BASEIMAGE=${{ matrix.baseimage }}
            APT_FORCE_IPV4=true
            ${{ matrix.toolchain != '' && format('TOOLCHAIN={0}', matrix.toolchain) || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
